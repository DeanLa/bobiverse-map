<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bobiverse Star Map</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Spoiler-free config screen ──────────────────────────────── -->
<div id="config-overlay">
  <div id="config-box">
    <h1>BOBIVERSE STAR MAP</h1>
    <p>Select how far you've read to avoid spoilers. The map will only show events, characters, and star systems up to your chosen point.</p>
    <label for="book-select">Book</label>
    <select id="book-select">
      <option value="1">Book 1: We Are Legion (We Are Bob)</option>
      <option value="2">Book 2: For We Are Many</option>
      <option value="3">Book 3: All These Worlds</option>
    </select>
    <div id="chapter-group">
      <label for="chapter-select">Chapter (show up to and including)</label>
      <select id="chapter-select"></select>
    </div>
    <label for="layout-select">Star layout</label>
    <select id="layout-select">
      <option value="spread">Spread (optimized for readability)</option>
      <option value="realistic">Realistic (astronomical positions)</option>
    </select>
    <button id="start-btn">Open Star Map</button>
    <div class="config-note">You can change these later using the controls in the top bar.</div>
  </div>
</div>

<!-- ── Main app ────────────────────────────────────────────────── -->
<div id="app">
  <div id="top-bar">
    <h1>BOBIVERSE STAR MAP</h1>
    <span id="year-display">2133</span>
    <button id="layout-btn">Layout: Spread</button>
    <span id="scope-label"></span>
  </div>
  <div id="main">
    <div id="map-container">
      <canvas id="canvas"></canvas>
      <div id="tooltip"></div>
      <div id="legend"></div>
    </div>
    <div id="event-panel">
      <div id="panel-tabs">
        <button class="panel-tab active" data-tab="events">Events</button>
        <button class="panel-tab" data-tab="tech">Tech</button>
        <button class="panel-tab" data-tab="species">Species</button>
        <button class="panel-tab" data-tab="combat">Battles</button>
        <button class="panel-tab" data-tab="quotes">Quotes</button>
        <button class="panel-tab" data-tab="arcs">Arcs</button>
      </div>
      <div class="panel-content active" data-content="events"><div id="event-log"></div></div>
      <div class="panel-content" data-content="tech"><div id="tech-list"></div></div>
      <div class="panel-content" data-content="species"><div id="species-list"></div></div>
      <div class="panel-content" data-content="combat"><div id="combat-list"></div></div>
      <div class="panel-content" data-content="quotes"><div id="quotes-list"></div></div>
      <div class="panel-content" data-content="arcs"><div id="arcs-list"></div></div>
    </div>
  </div>
  <div id="mood-strip"></div>
  <div id="timeline">
    <label>YEAR</label>
    <input type="range" id="slider" min="2133" max="2222" step="0.1" value="2133">
    <button id="play-btn">Play</button>
    <span id="speed-display">2.0 yr/s</span>
    <button id="comms-toggle" title="Toggle light-speed message dots">Comms: ON</button>
  </div>
</div>

<!-- ── Bob baseball card modal ──────────────────────────────── -->
<div id="bob-card" class="hidden">
  <div id="bob-card-inner">
    <button id="bob-card-close">×</button>
    <div id="bob-card-body"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
